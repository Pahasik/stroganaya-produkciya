<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#faf6ef" />

    <title>Клеёная имитация бруса и планкен оптом от производителя — от 34 000 ₽/м³</title>
    <meta
      name="description"
      content="Производство и оптовая продажа сухой строганой продукции: клеёная имитация бруса и клеёный планкен 20 × 135 мм от 34 000 ₽/м³. Минимальная партия от 10 м³, отгрузка без сорта C, шестиметровая комплектация, собственная доставка. Производство в Костромской области."
    />
    <link rel="canonical" href="https://example.com/" />
    <!-- TODO(владелец сайта): заменить example.com на реальный домен здесь, в og:url и в JSON-LD. -->

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta
      property="og:title"
      content="Клеёная имитация бруса и планкен оптом от производителя"
    />
    <meta
      property="og:description"
      content="Сухая строганая продукция от 34 000 ₽/м³, партия от 10 м³, собственная доставка. Производство в Костромской области, пгт Судиславль."
    />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="https://example.com/images/og-cover.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Пачки сухой строганой продукции в производственном помещении"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Предзагрузка изображения первого экрана. srcset/sizes должны совпадать с компонентом Picture. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-stack-1280.webp"
      imagesrcset="/images/hero-stack-640.webp 640w, /images/hero-stack-960.webp 960w, /images/hero-stack-1280.webp 1280w"
      imagesizes="(max-width: 1023px) 100vw, 46vw"
      fetchpriority="high"
    />

    <!--
      JSON-LD содержит только фактические данные из брифа.
      TODO(владелец сайта): после согласования добавить "name", "telephone", "email", "url"
      и, при наличии, "openingHours" — сейчас они намеренно не заполнены, чтобы не публиковать
      непроверенные сведения.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "description": "Производство и оптовая продажа сухой строганой продукции: клеёная имитация бруса, клеёный планкен, калиброванная и другая строганая продукция.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Шаховское шоссе, 9",
          "addressLocality": "пгт Судиславль",
          "addressRegion": "Костромская область",
          "addressCountry": "RU"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
